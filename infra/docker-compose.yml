name: work-service

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: work_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-work_service}
      POSTGRES_DB: work_service
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work_service -d work_service"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
